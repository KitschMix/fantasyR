name: Keep Supabase active

on:
  schedule:
    # GitHub Actions uses UTC: 03:17 UTC is 12:17 in Korea (KST).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Make a lightweight read-only database request
        env:
          SUPABASE_URL: https://xjxtherciihqhtgvmdhz.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ELjmlCGhAC3ZgZw52Qg7rw_MQSdrS43
        run: |
          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/fantasy_player_stats?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}"
