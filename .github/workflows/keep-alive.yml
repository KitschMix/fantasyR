# .github/workflows/keep-alive.yml
# 6시간마다 keep-alive endpoint 호출
# Vercel Hobby Cron = 일 2회 한도 → GitHub Actions 무료 cron 으로 우회
#
# Actions Secrets 에서 VERCEL_KEEPALIVE_URL 등록 필요
#   → https://<your-project>.vercel.app/api/keep-alive

name: Keep-Alive

on:
  # 6시간마다 (=00, 06, 12, 18시)
  # 00분 정시 4개 동시 트리거 피하려고 17분 오프셋
  schedule:
    - cron: "17 */6 * * *"
  # 수동 트리거 (디버깅 / 즉시 워밍업)
  workflow_dispatch:
    inputs:
      url:
        description: "keep-alive URL (기본: secrets 사용)"
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve URL
        id: resolve
        run: |
          URL="${{ secrets.VERCEL_KEEPALIVE_URL }}"
          if [ -n "${{ inputs.url }}" ]; then
            URL="${{ inputs.url }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::VERCEL_KEEPALIVE_URL secret is not set"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Pinging: $URL"

      - name: Ping keep-alive
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
               --retry-delay 5 --max-time 20 \
               -A "github-actions-keep-alive" \
               "$URL"
          echo "OK: $URL returned 2xx"
