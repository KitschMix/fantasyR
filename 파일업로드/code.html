<script>
        // Micro-interactions
        document.querySelectorAll('button, .cursor-pointer').forEach(el => {
            el.addEventListener('touchstart', function() {
                this.classList.add('opacity-70');
            });
            el.addEventListener('touchend', function() {
                this.classList.remove('opacity-70');
            });
        });

        // Sticky header transparency logic
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-lg', 'bg-background');
                header.classList.remove('shadow-sm', 'bg-background/90');
            } else {
                header.classList.remove('shadow-lg', 'bg-background');
                header.classList.add('shadow-sm', 'bg-background/90');
            }
        });
