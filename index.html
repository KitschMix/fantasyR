<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>게임 선택</title>
    <link rel="stylesheet" href="styles.css?v=20260707-bubble-v2" />
    <link rel="stylesheet" href="clue.css?v=20260706-split-pages" />
    <link rel="stylesheet" href="tally-ho.css?v=20260706-split-pages" />
    <link rel="stylesheet" href="cant-stop.css?v=20260707-markers-v6" />
    <link rel="stylesheet" href="monopoly.css?v=20260707-brumable-v15" />
    <link rel="stylesheet" href="splendor.css?v=20260707-splendor" />
    <link rel="stylesheet" href="dominion.css?v=20260707-dominion" />
  </head>
  <body class="launcher-active">
    <main class="app-shell">
      <section id="gameLauncher" class="game-launcher" aria-label="게임 선택">
        <a class="game-launcher-card" href="fantasy" aria-label="판타지왕국 입장">
          <img src="assets/titles/title-base.png" alt="판타지왕국" />
        </a>
        <a class="game-launcher-card clue-launcher-card" href="clue" aria-label="클루 입장">
          <img src="assets/titles/title-clue.jpg" alt="클루" />
        </a>
        <a class="game-launcher-card tally-launcher-card" href="tally-ho" aria-label="탤리 호 입장">
          <img src="assets/titles/title-tally-ho.png" alt="Tally Ho! 탤리 호" />
        </a>
        <a class="game-launcher-card cant-stop-launcher-card" href="cant-stop" aria-label="캔트스탑 입장">
          <img src="assets/titles/title-cant-stop.png" alt="Can't Stop 캔트스탑" />
        </a>
        <a class="game-launcher-card monopoly-launcher-card" href="monopoly" aria-label="부루마불 입장">
          <img src="assets/titles/brumable-logo.webp" alt="부루마불" />
        </a>
        <a class="game-launcher-card splendor-launcher-card" href="splendor" aria-label="스플렌더 입장">
          <img src="assets/titles/title-splendor.png" alt="💎 스플렌더" />
        </a>
        <a class="game-launcher-card dominion-launcher-card" href="dominion" aria-label="도미니언 입장">
          <img src="assets/titles/title-splendor.png" alt="👑 도미니언" />
        </a>
        <p class="launcher-device-note">PC 화면 권장 · 모바일은 가로 화면에서 플레이하세요.</p>
        <div class="game-launcher-coming-soon" aria-label="개발 예정 게임" hidden>
          <div class="game-launcher-placeholder" aria-disabled="true">
            <img src="assets/titles/title-dead-of-winter.png" alt="데드 오브 윈터 개발 예정" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
